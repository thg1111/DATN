[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    login: Kiem thu dang nhap (Data-Driven tu Excel)
    checkout: Kiem thu dat hang (Data-Driven tu Excel)
    keyword: Kiem thu huong tu khoa (Keyword-Driven tu Excel)
    smoke: Test nhanh cac luong chinh
